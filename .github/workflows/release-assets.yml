name: Publicar instaladores
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag da versão existente
        required: true
        default: v0.2.0
permissions:
  contents: write
concurrency:
  group: release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      REF: ${{ github.sha }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Baixar instaladores já assinados
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for name in Folha.apk Folha.zip SHA256SUMS.txt; do
            gh api "repos/$REPO/contents/dist/$name?ref=$REF" --jq '.content' | base64 --decode > "dist/$name"
          done
          sed -i 's/\r$//' dist/SHA256SUMS.txt
          (cd dist && sha256sum --check SHA256SUMS.txt)
      - name: Anexar arquivos à versão
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/Folha.apk dist/Folha.zip dist/SHA256SUMS.txt --repo "$REPO" --clobber
