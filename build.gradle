plugins { id 'com.android.application' version '8.13.2' }
android {
    namespace 'br.com.folha.notes'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig { applicationId 'br.com.folha.notes'; minSdk 29; targetSdk 36; versionCode 13; versionName '0.8.3' }
    sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs = ['src']; res.srcDirs = ['res']; assets.srcDirs = ['assets'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    signingConfigs { release { storeFile file('../toolchain/private/folha.p12'); storePassword 'folha-local-dev'; keyAlias 'folha'; keyPassword 'folha-local-dev' } }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    splits { abi { enable true; reset(); include 'arm64-v8a', 'x86_64'; universalApk false } }
    packaging {
        dex { useLegacyPackaging = true }
        resources.excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE','META-INF/LICENSE.txt','META-INF/NOTICE','META-INF/NOTICE.txt','org/bouncycastle/pqc/**']
    }
}
dependencies {
    implementation fileTree(dir:'libs',include:['*.jar'])
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    implementation 'com.google.mlkit:digital-ink-recognition:19.0.0'
}
